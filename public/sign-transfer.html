<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Connect your wallet to continue in Telegram.">
  <title>CeloRemit | Telegram Connect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="sign-transfer.css">
</head>
<body>
  <main class="signer-shell">
    <section class="signer-card">
      <div class="eyebrow" id="pageEyebrow">Telegram sign-in</div>
      <h1 id="pageTitle">Continue With Your Wallet</h1>
      <p class="lead" id="pageLead">
        Opened from Telegram. Connect once and we will take it from there.
      </p>

      <div class="network-banner" id="networkBanner">Loading Celo network config...</div>

      <div class="actions-row">
        <button id="connectWalletBtn" class="primary-btn" type="button">Connect wallet</button>
      </div>

      <div class="wallet-status" id="walletStatus">No wallet connected yet.</div>

      <div class="result-card" id="sessionCard" hidden>
        <div id="sessionOutput"></div>
      </div>

      <div class="result-card" id="resultCard" hidden>
        <div id="resultOutput"></div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
  <script type="module" src="sign-transfer.js"></script>
</body>
</html>
